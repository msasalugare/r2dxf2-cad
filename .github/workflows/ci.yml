name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Native tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust format
        run: cargo fmt --check

      - name: Rust clippy (rf-core)
        run: cargo clippy -p rf-core --all-targets -- -D warnings

      - name: Rust tests (rf-core)
        run: cargo test -p rf-core

      - name: Install web deps
        run: npm ci --prefix web

      - name: Web type check
        run: npm run lint --prefix web

      - name: Web unit tests
        run: npm run test --prefix web

  docker:
    name: Container + e2e smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and start the container
        run: docker compose up -d --build

      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "healthy after $i attempts"; exit 0
            fi
            sleep 1
          done
          echo "healthcheck never became healthy"; exit 1

      - name: Image size < 30 MB
        run: |
          size=$(docker image inspect rasterfit:latest --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 30000000

      - name: Install Playwright browser + deps
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium

      - name: e2e smoke against the container
        run: npm run e2e --prefix web

      - name: Tear down
        if: always()
        run: docker compose down
