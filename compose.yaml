services:
  rasterfit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rasterfit:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      RASTERFIT_SUPERADMIN_USERNAME: "${RASTERFIT_SUPERADMIN_USERNAME:-superadmin}"
      RASTERFIT_SUPERADMIN_PASSWORD: "${RASTERFIT_SUPERADMIN_PASSWORD:-}"
    volumes:
      - rasterfit_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Native FastAPI + rf-cli backend serves the API and the static web build.
    # Raster sessions are written to a tmpfs-backed temp dir (cleared on restart);
    # users/sessions persist on the named `rasterfit_data` volume (/data).

volumes:
  rasterfit_data:
