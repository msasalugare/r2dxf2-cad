# RasterFit static hosting config (nginx, port 8080, non-root image).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # WASM needs 'wasm-unsafe-eval'; PDF.js runs from a local worker (blob:).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    # --- Healthcheck (unlogged) ------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # --- WASM MIME (explicit, regardless of the base image's mime.types) ---
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Fingerprinted assets: immutable cache ----------------------------
    location ~* \.(js|mjs|css|svg|woff2|png|jpe?g|webp|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- index.html: no-cache (so new builds are picked up) ---------------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # --- SPA fallback for extensionless routes ----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
